---
# Brotto Inference Service - Kubernetes Deployment
# Standard production deployment with Brotto-9B model
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brotto-inference
  namespace: fara
  labels:
    app: brotto-inference
    model: fara1.5-9b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brotto-inference
      model: fara1.5-9b
  template:
    metadata:
      labels:
        app: brotto-inference
        model: fara1.5-9b
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: brotto-inference
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: inference
          image: brotto-inference:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: VLLM_MODEL_ID
              value: "fara1.5-9b"
            - name: VLLM_MODEL_REPO
              value: "inventic/fara1.5-9b"
            - name: VLLM_MAX_MODEL_LEN
              value: "32768"
            - name: VLLM_GPU_MEMORY_UTILIZATION
              value: "0.90"
            - name: VLLM_MAX_NUM_SEQS
              value: "256"
            - name: VLLM_TENSOR_PARALLEL_SIZE
              value: "1"
            - name: VLLM_PORT
              value: "8000"
            - name: SERVICE_PORT
              value: "8080"
          resources:
            requests:
              memory: "8Gi"
              cpu: "4"
              nvidia.com/gpu: 1
            limits:
              memory: "16Gi"
              cpu: "8"
              nvidia.com/gpu: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: brotto-model-cache
      nodeSelector:
        gpu: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
---
# Service for Brotto Inference
apiVersion: v1
kind: Service
metadata:
  name: brotto-inference
  namespace: fara
  labels:
    app: brotto-inference
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: brotto-inference
---
# Horizontal Pod Autoscaler for inference service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: brotto-inference-hpa
  namespace: fara
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brotto-inference
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: vllm_pending_requests
        target:
          type: AverageValue
          averageValue: "10"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
---
# PodDisruptionBudget for inference service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: brotto-inference-pdb
  namespace: fara
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: brotto-inference
---
# ServiceAccount for inference service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brotto-inference
  namespace: fara
