---
# Brotto Inference Service - Quality Profile (Brotto-27B)
# Higher resource requirements for difficult tasks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brotto-inference-quality
  namespace: fara
  labels:
    app: brotto-inference
    profile: quality
    model: fara1.5-27b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brotto-inference
      profile: quality
  template:
    metadata:
      labels:
        app: brotto-inference
        profile: quality
        model: fara1.5-27b
    spec:
      serviceAccountName: brotto-inference
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: inference
          image: brotto-inference:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: VLLM_MODEL_ID
              value: "fara1.5-27b"
            - name: VLLM_MODEL_REPO
              value: "inventic/fara1.5-27b"
            - name: VLLM_MAX_MODEL_LEN
              value: "32768"
            - name: VLLM_GPU_MEMORY_UTILIZATION
              value: "0.90"
            - name: VLLM_MAX_NUM_SEQS
              value: "64"
            - name: VLLM_TENSOR_PARALLEL_SIZE
              value: "2"
            - name: VLLM_PORT
              value: "8000"
            - name: SERVICE_PORT
              value: "8080"
          resources:
            requests:
              memory: "24Gi"
              cpu: "8"
              nvidia.com/gpu: 2
            limits:
              memory: "48Gi"
              cpu: "16"
              nvidia.com/gpu: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: brotto-model-cache
      nodeSelector:
        gpu: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
---
# Service for Quality inference
apiVersion: v1
kind: Service
metadata:
  name: brotto-inference-quality
  namespace: fara
  labels:
    app: brotto-inference
    profile: quality
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: brotto-inference
    profile: quality
---
# Horizontal Pod Autoscaler for quality inference
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: brotto-inference-quality-hpa
  namespace: fara
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brotto-inference-quality
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
