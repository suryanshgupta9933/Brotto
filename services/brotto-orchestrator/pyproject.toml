[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brotto-orchestrator"
version = "0.1.0"
description = "Browser automation orchestrator with agent loop and extension support"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["brotto_orchestrator"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
