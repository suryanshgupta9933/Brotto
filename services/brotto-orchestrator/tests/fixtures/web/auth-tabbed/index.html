<!doctype html>
<html><head><meta charset="utf-8"><title>Brotto fixture — tabbed</title></head>
<body>
  <h1>Sign in</h1>
  <form id="login" onsubmit="event.preventDefault();enter()">
    <label for="u">Email</label><input id="u" type="email">
    <label for="p">Password</label><input id="p" type="password">
    <button type="submit">Sign in</button>
  </form>
  <div id="app"></div>
  <script>
    function enter() {
      document.getElementById('app').innerHTML =
        '<div role="tablist">' +
        '<button role="tab" aria-selected="true" onclick="show(1)">Overview</button>' +
        '<button role="tab" aria-selected="false" onclick="show(2)">Archived</button>' +
        '</div><div id="panel"></div>';
      show(1);
    }
    // The target only exists in the panel the initially-selected tab does not show,
    // so the page cannot be completed without activating the other tab.
    function show(n) {
      document.getElementById('panel').innerHTML = n === 1
        ? '<div>Recent activity</div>'
        : '<div>Nothing recent.<button>Restore Draft</button></div>';
    }
  </script>
</body></html>
