name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ponytail: cancel an in-progress run when a new push lands on the same
# branch / PR. Avoids wasting runner-minutes on superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny. Without this, every job inherits the repository default token,
# and two of these three run npm install and pip install against PR-controlled
# lockfiles. test-orchestrator widens to code-quality: write for the one upload
# below — an explicit grant rather than the only declaration in the file.
#
# `actions/upload-artifact` and the buildx `type=gha` cache use the Actions
# runtime token, not GITHUB_TOKEN, so neither needs a scope here.
permissions:
  contents: read

jobs:
  # ─── Orchestrator: type + unit tests ────────────────────────────────
  test-orchestrator:
    name: Orchestrator tests
    runs-on: ubuntu-latest
    # No permissions block: it inherits the workflow default above. The
    # code-quality: write this job briefly carried went away with the coverage
    # upload — see docs/branch-protection.md for why that upload is not here.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      # ponytail: pip + requirements*.txt, not `uv sync`. uv is what
      # CONTRIBUTING tells contributors to use locally, but this job pins
      # the requirements files so a lockfile reformat can't break CI on its
      # own. Both describe the same dependency set; if they ever disagree,
      # requirements*.txt wins here and pyproject.toml wins locally.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # A gate, and it can be one because requirements.txt bounds every
      # floor to a verified version and every cap to the next major. It
      # was advisory while the floors were `pydantic-ai>=0.0.1`, where the
      # audit read a ~120-package tree the project does not use and an
      # upstream release could redden the build on its own. The tree is
      # ~40 packages now, all three factories' extras and nothing else.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      # ponytail: services/brotto-orchestrator/src is the only thing on
      # PYTHONPATH that makes `brotto_orchestrator` importable. The old
      # Dockerfile already used this env var.
      #
      # Coverage has been measurable since pytest-cov landed in
      # requirements-dev and was never once invoked. It could not be:
      # seven test files set AGENT_AUTH_DISABLED at *import*, so a
      # developer's real AGENT_SECRET from .env turned auth on for every
      # test collected before the first one — and coverage reorders the
      # imports. conftest.py now clears the pair per-test and 51 tests
      # stop failing. 77% today; --cov-fail-under is a ratchet against
      # a drop, not a target to climb (raise it when it climbs).
      - name: Run tests
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/services/brotto-orchestrator/src
        run: |
          pytest services/brotto-orchestrator/tests -v --tb=short \
            --cov=brotto_orchestrator --cov-report=term --cov-fail-under=75

  # ─── Extension: type-check + bundle ────────────────────────────────
  build-extension:
    name: Extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ponytail: build.mjs calls `rsvg-convert` to rasterize the SVG
      # icon at 16/32/48/128 px. librsvg isn't on the GitHub runner by
      # default — install it once per job. If the icon pipeline ever
      # moves to a Node renderer (e.g. @resvg/resvg-js), drop this step.
      - name: Install librsvg (rsvg-convert)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/brotto-extension/package-lock.json

      - name: Install dependencies
        working-directory: clients/brotto-extension
        run: npm ci

      # A gate, and the steadier of the two audits: package-lock.json pins
      # exact versions, so this reports on the tree that is literally
      # installed. The Python audit re-resolves, bounded but not pinned.
      - name: Audit npm dependencies
        working-directory: clients/brotto-extension
        run: npm audit --audit-level=high

      # ponytail: tsc --noEmit catches type errors without emitting
      # files. Run before the real build so the type-error signal is
      # surfaced even if esbuild happily swallows any.
      - name: Type check
        working-directory: clients/brotto-extension
        run: npx tsc --noEmit

      - name: Build
        working-directory: clients/brotto-extension
        run: npm run build

      # The 26 scripts/*.test.js files are the only check for panel
      # rendering, replay, key dispatch, the model-check gate order and the
      # observation guards — CLAUDE.md names each one. They extract the real
      # functions out of the shipped sources and eval them, so a run here is
      # the same check a developer gets locally. Runs after Build because
      # they read the bundles. ~6s.
      #
      # ponytail: `npm test` would be one line but re-runs `npm run build`
      # first; the build is already the step above.
      - name: Run extension JS tests
        working-directory: clients/brotto-extension
        run: node --test ../../scripts/*.test.js

      # ponytail: surface the bundle for download in the Actions UI —
      # useful for QA to grab the exact artifact a green run produced.
      - name: Upload extension bundle
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: clients/brotto-extension/dist
          if-no-files-found: error
          retention-days: 7

  # ─── Self-host image builds ───────────────────────────────────────
  # The image is the whole product for a self-hoster, and it has shipped
  # broken before: the Dockerfile did not build at all until 2026-10-03.
  # Nothing else here proves it builds — test_compose_volume.py reads the
  # compose file, it does not build the image.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # gha layer cache: the builder stage compiles wheels, so an uncached
      # run is minutes. ponytail: `docker build -t brotto:ci .` is the
      # one-line alternative and verifies the same thing — drop this if the
      # runner minutes ever matter more than the wait.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: brotto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
