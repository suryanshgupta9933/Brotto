# Brotto GPU Deployment Examples
# Production vLLM deployment configurations for Brotto Inference Service

---
# Single GPU Deployment (T4/NVIDIA RTX 4090)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brotto-inference-single-gpu
  labels:
    app.kubernetes.io/name: fara
    app.kubernetes.io/component: brotto-inference
    gpu-type: single
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fara
      app.kubernetes.io/component: brotto-inference
      gpu-type: single
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fara
        app.kubernetes.io/component: brotto-inference
        gpu-type: single
    spec:
      nodeSelector:
        node.kubernetes.io/lifecycle: gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: brotto-inference
          image: ghcr.io/inventic/fara15/brotto-inference:latest
          ports:
            - name: vllm
              containerPort: 8000
            - name: api
              containerPort: 8080
          env:
            - name: VLLM_PORT
              value: "8000"
            - name: SERVICE_PORT
              value: "8080"
            - name: VLLM_MODEL_REPO
              value: "inventic/fara1.5-9b"
            - name: VLLM_MODEL_ID
              value: "fara1.5-9b"
            - name: VLLM_MAX_MODEL_LEN
              value: "32768"
            - name: VLLM_GPU_MEMORY_UTILIZATION
              value: "0.90"
            - name: VLLM_MAX_NUM_SEQS
              value: "256"
            - name: VLLM_MAX_NUM_CONCURRENT_LIMIT
              value: "256"
            - name: VLLM_TENSOR_PARALLEL_SIZE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "16"
              memory: "64Gi"
            requests:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: "32Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/vllm
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: brotto-inference-model-cache
---
# Multi-GPU Deployment (A100/H100)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brotto-inference-multi-gpu
  labels:
    app.kubernetes.io/name: fara
    app.kubernetes.io/component: brotto-inference
    gpu-type: multi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fara
      app.kubernetes.io/component: brotto-inference
      gpu-type: multi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fara
        app.kubernetes.io/component: brotto-inference
        gpu-type: multi
    spec:
      nodeSelector:
        node.kubernetes.io/lifecycle: gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: brotto-inference
          image: ghcr.io/inventic/fara15/brotto-inference:latest
          ports:
            - name: vllm
              containerPort: 8000
            - name: api
              containerPort: 8080
          env:
            - name: VLLM_PORT
              value: "8000"
            - name: SERVICE_PORT
              value: "8080"
            - name: VLLM_MODEL_REPO
              value: "inventic/fara1.5-27b"
            - name: VLLM_MODEL_ID
              value: "fara1.5-27b"
            - name: VLLM_MAX_MODEL_LEN
              value: "65536"
            - name: VLLM_GPU_MEMORY_UTILIZATION
              value: "0.95"
            - name: VLLM_MAX_NUM_SEQS
              value: "512"
            - name: VLLM_MAX_NUM_CONCURRENT_LIMIT
              value: "512"
            - name: VLLM_TENSOR_PARALLEL_SIZE
              value: "4"
            - name: VLLM_PIPELINE_PARALLEL_SIZE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 4
              cpu: "64"
              memory: "256Gi"
            requests:
              nvidia.com/gpu: 4
              cpu: "32"
              memory: "128Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/vllm
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: brotto-inference-model-cache
---
# Autoscaling GPU Deployment
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: brotto-inference-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brotto-inference-single-gpu
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: nvidia.com/gpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# GPU Node Pool Config (for cluster-autoscaler integration)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-node-config
data:
  # AWS EKS Karpenter NodeClass example
  karpenter-nodeclass.yaml: |
    apiVersion: karpenter.sh/v1beta1
    kind: NodeClass
    metadata:
      name: gpu-nodeclass
    spec:
      amiFamily: Ubuntu
      role: karpenter-node-role
      subnetSelectors:
        karpenter.sh/discovery: fara15
      securityGroupSelectors:
        karpenter.sh/discovery: fara15
      amiSelectorTerms:
        - id: ami-0123456789abcdef0
      tags:
        Name: fara15-gpu
        Karpenter.sh/discovery: fara15

  # GPU-ready node template
  gpu-node-template.yaml: |
    apiVersion: karpenter.sh/v1beta1
    kind: NodeTemplate
    metadata:
      name: gpu-node-template
    spec:
      nodeClassRef:
        name: gpu-nodeclass
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g5.xlarge
            - g5.2xlarge
            - g5.4xlarge
            - p4d.24xlarge
            - p5.48xlarge
        - key: nvidia.com/gpu
          operator: Exists
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
            - spot
      kubeletConfiguration:
        maxPods: 110
        imageGCHighThresholdPercent: 85
        imageGCLowThresholdPercent: 65
---
# Prometheus GPU Metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-prometheus-config
data:
  gpu-metrics.yaml: |
    # GPU Prometheus metrics configuration
    - job_name: nvidia-gpu
      static_configs:
        - targets:
            - nvidia-gpu-exporter:9100
      metrics_path: /metrics
      relabel_configs:
        - source_labels: [__address__]
          target_label: instance
