global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'control-plane'
    static_configs:
      - targets: ['control-plane:3000']
    metrics_path: /metrics

  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:3000']
    metrics_path: /metrics

  - job_name: 'fara-inference'
    static_configs:
      - targets: ['fara-inference:8080']
    metrics_path: /metrics

  - job_name: 'playwright-mcp-gateway'
    static_configs:
      - targets: ['playwright-mcp-gateway:8080']
    metrics_path: /metrics

  - job_name: 'cdp-relay'
    static_configs:
      - targets: ['cdp-relay:8080']
    metrics_path: /metrics

  - job_name: 'artifact-service'
    static_configs:
      - targets: ['artifact-service:3001']
    metrics_path: /metrics

  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:3001']
    metrics_path: /metrics
