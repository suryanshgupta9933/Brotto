apiVersion: v2
name: fara-platform
description: Fara1.5 Browser Automation Platform - Full Stack Deployment
type: application
version: 1.0.0
appVersion: "1.5.0"
kubeVersion: ">=1.28.0"
keywords:
  - browser-automation
  - ai-agent
  - playwright
  - vllm
  - fara
home: https://fara.example.com
sources:
  - https://github.com/inventic/fara15-platform
maintainers:
  - name: Fara Team
    email: engineering@fara.example.com
icon: https://fara.example.com/logo.png

dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

annotations:
  category: AI/ML
  licenses: Apache-2.0
