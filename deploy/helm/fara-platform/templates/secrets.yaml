{{- if .Values.postgresql.enabled }}
{{- $postgresqlHost := printf "%s-postgresql" (include "fara-platform.fullname" .) }}
{{- $postgresqlPort := .Values.postgresql.service.port }}
{{- end }}

{{- if .Values.redis.enabled }}
{{- $redisHost := printf "%s-redis" (include "fara-platform.fullname" .) }}
{{- $redisPort := .Values.redis.service.port }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fara-platform.fullname" . }}-secrets
  labels:
    {{- include "fara-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ printf "postgresql://%s:%s@%s:%d/%s" (.Values.postgresql.auth.username) ( .Values.postgresql.auth.password | default (randAlphaNum 32)) $postgresqlHost $postgresqlPort (.Values.postgresql.auth.database) }}
  redis-url: {{ printf "redis://%s@%s:%d" ( .Values.redis.auth.password | default (randAlphaNum 32)) $redisHost $redisPort }}
  oidc-client-secret: {{ randAlphaNum 32 }}
  vllm-api-key: {{ .Values.faraInference.env.VLLM_API_KEY | default (randAlphaNum 32) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fara-platform.fullname" . }}-postgres-secrets
  labels:
    {{- include "fara-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresql.auth.password | default (randAlphaNum 32) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fara-platform.fullname" . }}-redis-secrets
  labels:
    {{- include "fara-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ .Values.redis.auth.password | default (randAlphaNum 32) }}
