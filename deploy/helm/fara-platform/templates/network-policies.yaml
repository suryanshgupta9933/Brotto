---
# Network Policy for Audit Service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fara.fullname" . }}-audit-service
  labels:
    {{- include "fara.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fara.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: audit-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: control-plane
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: orchestrator
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
