{{- if .Values.auditService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fara-platform.fullname" . }}-audit-service
  labels:
    {{- include "fara-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-service
spec:
  replicas: {{ .Values.auditService.replicaCount }}
  selector:
    matchLabels:
      {{- include "fara-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: audit-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "fara-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: audit-service
    spec:
      serviceAccountName: {{ include "fara-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: audit-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.auditService.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.auditService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.auditService.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.auditService.env.PORT | quote }}
            - name: HOST
              value: {{ .Values.auditService.env.HOST | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fara-platform.fullname" . }}-secrets
                  key: database-url
            - name: LOG_LEVEL
              value: {{ .Values.auditService.env.LOG_LEVEL | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.exporterEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "audit-service"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.auditService.resources | nindent 12 }}
      {{- with .Values.auditService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.auditService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.auditService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fara-platform.fullname" . }}-audit-service
  labels:
    {{- include "fara-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-service
spec:
  type: {{ .Values.auditService.service.type }}
  ports:
    - port: {{ .Values.auditService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fara-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: audit-service
{{- end }}
