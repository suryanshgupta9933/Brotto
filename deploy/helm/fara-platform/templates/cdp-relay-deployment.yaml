{{- if .Values.cdpRelay.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fara.fullname" . }}-cdp-relay
  labels:
    {{- include "fara.labels" . | nindent 4 }}
    app.kubernetes.io/component: cdp-relay
spec:
  replicas: {{ .Values.cdpRelay.replicaCount }}
  selector:
    matchLabels:
      {{- include "fara.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cdp-relay
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "fara.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cdp-relay
    spec:
      serviceAccountName: {{ include "fara.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cdp-relay
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.cdpRelay.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.cdpRelay.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ADDRESS
              value: {{ .Values.cdpRelay.env.ADDRESS | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.cdpRelay.env.LOG_LEVEL | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.exporterEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "cdp-relay"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.cdpRelay.resources | nindent 12 }}
      {{- with .Values.cdpRelay.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cdpRelay.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cdpRelay.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fara.fullname" . }}-cdp-relay
  labels:
    {{- include "fara.labels" . | nindent 4 }}
    app.kubernetes.io/component: cdp-relay
spec:
  type: {{ .Values.cdpRelay.service.type }}
  ports:
    - port: {{ .Values.cdpRelay.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fara.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cdp-relay
{{- end }}
