{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fara.fullname" . }}-control-plane
  labels:
    {{- include "fara.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "fara.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "fara.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: {{ include "fara.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control-plane
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.controlPlane.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.controlPlane.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.controlPlane.env.PORT | quote }}
            - name: HOST
              value: {{ .Values.controlPlane.env.HOST | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fara.fullname" . }}-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "fara.fullname" . }}-secrets
                  key: redis-url
            - name: OIDC_ISSUER
              value: {{ .Values.controlPlane.env.OIDC_ISSUER | default "" | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.controlPlane.env.OIDC_CLIENT_ID | default "api-gateway" | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fara.fullname" . }}-secrets
                  key: oidc-client-secret
            - name: OIDC_AUDIENCE
              value: {{ .Values.controlPlane.env.OIDC_AUDIENCE | default "api://fara15" | quote }}
            - name: SESSION_LEASE_TTL
              value: {{ .Values.controlPlane.env.SESSION_LEASE_TTL | quote }}
            - name: APPROVAL_REQUEST_TTL
              value: {{ .Values.controlPlane.env.APPROVAL_REQUEST_TTL | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.controlPlane.env.LOG_LEVEL | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.exporterEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "control-plane"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fara.fullname" . }}-control-plane
  labels:
    {{- include "fara.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - port: {{ .Values.controlPlane.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fara.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
{{- end }}
