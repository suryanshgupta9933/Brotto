{{- if .Values.playwrightMcpGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fara-platform.fullname" . }}-playwright-mcp-gateway
  labels:
    {{- include "fara-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: playwright-mcp-gateway
spec:
  replicas: {{ .Values.playwrightMcpGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "fara-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: playwright-mcp-gateway
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "fara-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: playwright-mcp-gateway
    spec:
      serviceAccountName: {{ include "fara-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: playwright-mcp-gateway
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.playwrightMcpGateway.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.playwrightMcpGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.playwrightMcpGateway.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.playwrightMcpGateway.env.PORT | quote }}
            - name: HOST
              value: {{ .Values.playwrightMcpGateway.env.HOST | quote }}
            - name: CDP_RELAY_URL
              value: "ws://{{ include "fara-platform.fullname" . }}-cdp-relay:8080"
            - name: LOG_LEVEL
              value: {{ .Values.playwrightMcpGateway.env.LOG_LEVEL | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.exporterEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "playwright-mcp-gateway"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.playwrightMcpGateway.resources | nindent 12 }}
      {{- with .Values.playwrightMcpGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.playwrightMcpGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.playwrightMcpGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fara-platform.fullname" . }}-playwright-mcp-gateway
  labels:
    {{- include "fara-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: playwright-mcp-gateway
spec:
  type: {{ .Values.playwrightMcpGateway.service.type }}
  ports:
    - port: {{ .Values.playwrightMcpGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fara-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: playwright-mcp-gateway
{{- end }}
