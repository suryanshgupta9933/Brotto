{{- if .Values.artifactService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fara.fullname" . }}-artifact-service
  labels:
    {{- include "fara.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-service
spec:
  replicas: {{ .Values.artifactService.replicaCount }}
  selector:
    matchLabels:
      {{- include "fara.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: artifact-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "fara.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: artifact-service
    spec:
      serviceAccountName: {{ include "fara.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: artifact-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.artifactService.image.repository }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.artifactService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.artifactService.env.NODE_ENV | quote }}
            - name: ARTIFACT_SERVICE_PORT
              value: {{ .Values.artifactService.env.ARTIFACT_SERVICE_PORT | quote }}
            - name: ARTIFACT_SERVICE_HOST
              value: {{ .Values.artifactService.env.ARTIFACT_SERVICE_HOST | quote }}
            - name: STORAGE_PATH
              value: {{ .Values.artifactService.env.STORAGE_PATH | quote }}
            - name: MAX_FILE_SIZE
              value: {{ .Values.artifactService.env.MAX_FILE_SIZE | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.artifactService.env.LOG_LEVEL | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.exporterEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "artifact-service"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.artifactService.resources | nindent 12 }}
          volumeMounts:
            - name: artifact-storage
              mountPath: {{ .Values.artifactService.env.STORAGE_PATH }}
      volumes:
        - name: artifact-storage
          {{- if .Values.artifactService.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "fara.fullname" . }}-artifact-service
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.artifactService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.artifactService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.artifactService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fara.fullname" . }}-artifact-service
  labels:
    {{- include "fara.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-service
spec:
  type: {{ .Values.artifactService.service.type }}
  ports:
    - port: {{ .Values.artifactService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fara.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-service
{{- if .Values.artifactService.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fara.fullname" . }}-artifact-service
  labels:
    {{- include "fara.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.artifactService.persistence.size }}
  storageClassName: {{ .Values.artifactService.persistence.storageClass }}
{{- end }}
{{- end }}
