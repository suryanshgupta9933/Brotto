# Brotto Platform Helm Chart Values
# Full deployment configuration

## Global settings
global:
  imageRegistry: ghcr.io/inventic/fara15
  imagePullSecrets:
    - name: ghcr-secret
  storageClass: standard

## Image tag for all services
imageTag: latest

## Control Plane (API Gateway)
controlPlane:
  enabled: true
  replicaCount: 2

  image:
    repository: control-plane
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: api.fara.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: control-plane-tls
        hosts:
          - api.fara.example.com

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  env:
    NODE_ENV: production
    PORT: 3000
    HOST: 0.0.0.0
    SESSION_LEASE_TTL: 300
    APPROVAL_REQUEST_TTL: 600
    LOG_LEVEL: info

  nodeSelector: {}

  tolerations: []

  affinity: {}

## Agent Orchestrator
orchestrator:
  enabled: true
  replicaCount: 2

  image:
    repository: orchestrator
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  env:
    NODE_ENV: production
    PORT: 3000
    HOST: 0.0.0.0
    LOG_LEVEL: info

  nodeSelector: {}

  tolerations: []

  affinity: {}

## Brotto Inference (vLLM)
faraInference:
  enabled: true
  replicaCount: 1

  image:
    repository: brotto-inference
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    ports:
      vllm: 8000
      api: 8080

  resources:
    limits:
      cpu: 16
      memory: 64Gi
      nvidia.com/gpu: 1
    requests:
      cpu: 8
      memory: 32Gi
      nvidia.com/gpu: 1

  env:
    VLLM_PORT: 8000
    SERVICE_PORT: 8080
    VLLM_MODEL_REPO: inventic/fara1.5-9b
    VLLM_MODEL_ID: fara1.5-9b
    VLLM_MAX_MODEL_LEN: 32768
    VLLM_GPU_MEMORY_UTILIZATION: "0.90"
    VLLM_MAX_NUM_SEQS: "256"
    VLLM_MAX_NUM_CONCURRENT_LIMIT: "256"

  nodeSelector:
    node.kubernetes.io/lifecycle: gpu

  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"

  affinity: {}

  persistence:
    enabled: true
    storageClass: standard
    size: 100Gi
    modelCache:
      enabled: true
      size: 50Gi

## Playwright MCP Gateway
playwrightMcpGateway:
  enabled: true
  replicaCount: 2

  image:
    repository: playwright-mcp-gateway
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  env:
    NODE_ENV: production
    PORT: 8080
    HOST: 0.0.0.0
    LOG_LEVEL: info
    PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser

  nodeSelector: {}

  tolerations: []

  affinity: {}

## CDP Relay
cdpRelay:
  enabled: true
  replicaCount: 2

  image:
    repository: cdp-relay
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 128Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  env:
    ADDRESS: 0.0.0.0:8080
    LOG_LEVEL: info

  nodeSelector: {}

  tolerations: []

  affinity: {}

## Artifact Service
artifactService:
  enabled: true
  replicaCount: 2

  image:
    repository: artifact-service
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3001

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: artifacts.fara.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: artifact-service-tls
        hosts:
          - artifacts.fara.example.com

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  persistence:
    enabled: true
    storageClass: standard
    size: 50Gi

  env:
    NODE_ENV: production
    ARTIFACT_SERVICE_PORT: 3001
    ARTIFACT_SERVICE_HOST: 0.0.0.0
    STORAGE_PATH: /var/artifact-service/storage
    MAX_FILE_SIZE: "104857600"
    LOG_LEVEL: info

  nodeSelector: {}

  tolerations: []

  affinity: {}

## Audit Service
auditService:
  enabled: true
  replicaCount: 2

  image:
    repository: audit-service
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3001

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  env:
    NODE_ENV: production
    PORT: 3001
    HOST: 0.0.0.0
    LOG_LEVEL: info

  nodeSelector: {}

  tolerations: []

  affinity: {}

## PostgreSQL (external by default)
postgresql:
  enabled: true
  auth:
    username: fara15
    password: ""
    database: fara15_control_plane
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 1Gi
  readReplicas:
    replicaCount: 2
    persistence:
      enabled: true
      size: 20Gi
  service:
    type: ClusterIP

## Redis (external by default)
redis:
  enabled: true
  auth:
    enabled: true
    password: ""
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 256Mi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 5Gi
  service:
    type: ClusterIP

## Network Policies
networkPolicies:
  enabled: true

  # Control plane can talk to all internal services
  controlPlane:
    egress:
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: postgresql
        ports:
          - protocol: TCP
            port: 5432
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: redis
        ports:
          - protocol: TCP
            port: 6379
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: orchestrator
        ports:
          - protocol: TCP
            port: 3000

  # Orchestrator can talk to inference, browser gateway, and CDP relay
  orchestrator:
    egress:
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: brotto-inference
        ports:
          - protocol: TCP
            port: 8080
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: playwright-mcp-gateway
        ports:
          - protocol: TCP
            port: 8080
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: cdp-relay
        ports:
          - protocol: TCP
            port: 8080

  # Browser gateway and CDP relay are internal only
  browserGateway:
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: orchestrator
        ports:
          - protocol: TCP
            port: 8080

  cdpRelay:
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: orchestrator
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: playwright-mcp-gateway
        ports:
          - protocol: TCP
            port: 8080

## OpenTelemetry Configuration
opentelemetry:
  enabled: true
  exporterEndpoint: ""
  serviceName: fara
  samplingRate: "1.0"

## Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
  grafana:
    enabled: true
    port: 3000
    adminUser: admin
    adminPassword: ""

## Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-write-timeout: "300"

## Security
securityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

podDisruptionBudget:
  enabled: true
  minAvailable: 1

## Service Account
serviceAccount:
  create: true
  name: fara
  annotations: {}

## RBAC
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["configmaps", "secrets", "services"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets"]
      verbs: ["get", "list", "watch"]
