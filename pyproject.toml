[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brotto-orchestrator"
version = "0.1.0"
description = "Browser automation orchestrator with agent loop and extension support"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0",
    "pydantic-ai>=0.0.1",
    "aiohttp>=3.9.0",
    "anthropic>=0.21.0",
    "python-dotenv>=1.0.0",
]

# ponytail: find, not an explicit list. An explicit list silently dropped
# every subpackage (agent, model, policy, cdp, ...), so `pip install .`
# produced a top-level-only package that ImportError'd on first use.
# services/brotto-orchestrator/pyproject.toml declares the same project for
# in-place installs; the two must agree.
[tool.setuptools.packages.find]
where = ["services/brotto-orchestrator/src"]

[dependency-groups]
dev = [
    "playwright>=1.40.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["services/brotto-orchestrator/tests"]
asyncio_mode = "auto"