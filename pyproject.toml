[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brotto-orchestrator"
version = "0.1.0"
description = "An AI agent that works inside your own logged-in Chrome. Reads the accessibility tree instead of screenshots. Bring your own model key."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Brotto contributors" }]
keywords = [
    "browser-automation",
    "ai-agent",
    "chrome-extension",
    "accessibility-tree",
    "llm",
    "bring-your-own-key",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Utilities",
]

# ponytail: mirrors requirements.txt exactly, and there is a reason it
# is duplicated rather than read from that file. setuptools can source
# this list dynamically (`dynamic = ["dependencies"]` +
# [tool.setuptools.dynamic]), which would make requirements.txt the only
# copy — but the Dockerfile builds the wheel in a stage that copies
# pyproject.toml alone, so the build would break on a missing
# requirements.txt. One line of Dockerfile fixes that; it is a real
# improvement, not a reason to keep two lists drifting.
dependencies = [
    "fastapi>=0.142.2,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "pydantic>=2.13.5,<3.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.53.0,<3.0",
    "aiohttp>=3.14.3,<4.0",
    "python-dotenv>=1.2.4,<2.0",
]

[project.scripts]
brotto = "brotto_orchestrator.cli:main"

[project.urls]
Homepage = "https://github.com/suryanshgupta9933/brotto"
Repository = "https://github.com/suryanshgupta9933/brotto"
Issues = "https://github.com/suryanshgupta9933/brotto/issues"
Security = "https://github.com/suryanshgupta9933/brotto/blob/main/SECURITY.md"

# ponytail: find, not an explicit list. An explicit list silently dropped
# every subpackage (agent, model, policy, cdp, ...), so `pip install .`
# produced a top-level-only package that ImportError'd on first use.
# This is the only pyproject; a second one at
# services/brotto-orchestrator/pyproject.toml declared the same project
# with a different `where` and different dep groups, and they drifted.
[tool.setuptools.packages.find]
where = ["services/brotto-orchestrator/src"]

# ponytail: mirrors requirements-dev.txt, which is what CI installs.
[dependency-groups]
dev = [
    "playwright>=1.63.0,<2.0",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["services/brotto-orchestrator/tests"]
asyncio_mode = "auto"