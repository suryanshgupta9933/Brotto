[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fara-platform-sdk"
version = "1.0.0"
description = "Official Python SDK for the Fara1.5 Browser Automation Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Fara Team", email = "sdk@fara.example.com"}
]
keywords = ["fara", "browser-automation", "sdk", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpserver>=1.0.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/fara-platform/fara15"
Documentation = "https://docs.fara.example.com"
Repository = "https://github.com/fara-platform/fara15"

[tool.setuptools.packages.find]
where = ["."]
include = ["fara_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
