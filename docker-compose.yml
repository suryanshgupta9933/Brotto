# Brotto orchestrator — self-host.
#
#   cp .env.example .env      # set AGENT_SECRET
#   docker compose up -d
#
# Deliberately not here: a model API key. Brotto is bring-your-own-key,
# so the key is entered in the extension by the person using it and never
# reaches this box. The only secret this file needs is AGENT_SECRET, and
# it lives in a local .env that .dockerignore keeps out of the image.

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: brotto-orchestrator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # see note below before changing this
    env_file:
      - path: .env
        required: false
    environment:
      # The one secret the operator supplies. `${VAR:?message}` makes
      # compose refuse to start with a readable explanation rather than
      # a bare "stat .env: no such file", and it does not silently fall
      # back to the development .env — which holds a model key and an
      # AGENT_MODEL, and would defeat BROTTO_ENV=prod below.
      #
      # Note this is a *deployment* .env beside this file, distinct from
      # services/brotto-orchestrator/.env, which is the development one.
      # Do not point the container at the development file.
      AGENT_SECRET: ${AGENT_SECRET:?set AGENT_SECRET in the shell, or in a .env file beside docker-compose.yml}
      # Repeated here, not only in the Dockerfile: a stale or missing
      # value is the exact failure this guards against. In dev mode the
      # server pre-seeds AGENT_MODEL and propagates ANTHROPIC_AUTH_TOKEN,
      # so a user who forgets to paste a key spends the operator's model
      # credits. It fails silently and looks like a successful run.
      BROTTO_ENV: prod
      # Every state directory must be on the volume or session history,
      # security policy and the remembered model config all vanish on
      # every container restart. The third one was easy to miss: store.py
      # defaults to logs/user_models, which is inside the image, so
      # "remember my model" silently reset while the other two persisted.
      BROTTO_SESSIONS_DIR: /data/sessions
      BROTTO_USER_POLICY_DIR: /data/user_policies
      BROTTO_USER_MODEL_DIR: /data/user_models
      # Age sessions out after N days without use. Unset keeps everything,
      # which is the default on purpose: the data is the user's own disk, and
      # nothing should expire until they ask. 0 means off, not "delete
      # everything", and a value that is not a number is logged and skipped
      # rather than crashing startup. See docs/architecture/deployment.md.
      # BROTTO_RETENTION_DAYS: 30
    volumes:
      - brotto-data:/data

# Bound to loopback on purpose. AGENT_SECRET gates /ws/ext and the session
# endpoints, but with an unset secret every caller is trusted, so exposing
# this on a network would hand your logged-in browser to anyone who can
# reach the port. compose refuses to start without the secret (see above).
# Put a TLS-terminating reverse proxy in front and change this to "8000:8000"
# — the extension needs a wss:// URL, not a plaintext one.
volumes:
  brotto-data:
